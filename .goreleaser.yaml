version: 2

project_name: ymz

builds:
  - id: ymz
    main: ./cmd/ymz
    binary: ymz
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Version={{ .Version }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Commit={{ .Commit }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: ymzd
    main: ./cmd/ymzd
    binary: ymzd
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Version={{ .Version }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Commit={{ .Commit }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - ymz
      - ymzd
    # Versioned names (must match packaging/scripts/install-*.{sh,ps1}).
    # Tag v0.1.0 → .Version is 0.1.0 (no leading v).
    name_template: "ymz_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - src: configs/agent.json.example
        dst: configs
        strip_parent: true
      - src: configs/agent.schema.json
        dst: configs
        strip_parent: true
      - src: packaging/systemd/yunmengze.service
        dst: packaging/systemd
        strip_parent: true
      - src: packaging/scripts/*.sh
        dst: packaging/scripts
        strip_parent: true
      - src: packaging/scripts/*.ps1
        dst: packaging/scripts
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  name_template: "YunmengZe Agent v{{ .Version }}"
  draft: false
  # Alpha first binary: mark Pre-release on GitHub.
  prerelease: true
  mode: replace

# Homebrew Cask + Scoop. Requires PACKAGE_GITHUB_TOKEN with Contents: R/W on
# yyZe0122/homebrew-tap and yyZe0122/scoop-bucket. Default GITHUB_TOKEN cannot
# push to other repos (Actions or local). GoReleaser v2: use homebrew_casks
# (legacy brews/formula is deprecated and fails `goreleaser check`).
homebrew_casks:
  - name: ymz
    repository:
      owner: yyZe0122
      name: homebrew-tap
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/yyZe0122/YunmengZe-Agent"
    description: "YunmengZe Agent — local-first, policy-controlled automation agent"
    license: "Apache-2.0"
    binaries:
      - ymz
      - ymzd
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    skip_upload: auto

scoops:
  - name: ymz
    repository:
      owner: yyZe0122
      name: scoop-bucket
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    homepage: "https://github.com/yyZe0122/YunmengZe-Agent"
    description: "YunmengZe Agent — local-first, policy-controlled automation agent"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} {{ .Tag }}"
    skip_upload: auto

# Body MUST come from --release-notes=docs/history/changelog/<tag>.md (never git log).
changelog:
  disable: true
