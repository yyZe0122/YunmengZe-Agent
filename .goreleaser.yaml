version: 2

project_name: ymz

builds:
  - id: ymz
    main: ./cmd/ymz
    binary: ymz
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Version={{ .Version }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Commit={{ .Commit }}
        -X github.com/yyZe0122/yunmengze-agent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"


archives:
  - ids:
      - ymz
    # Versioned names (must match packaging/scripts/install-*.{sh,ps1}).
    # Tag v0.1.0 → .Version is 0.1.0 (no leading v).
    name_template: "ymz_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - README.zh.md
      - LICENSE
      - src: configs/agent.json.example
        dst: configs
        strip_parent: true
      - src: configs/agent.schema.json
        dst: configs
        strip_parent: true
      - src: packaging/scripts/*.sh
        dst: packaging/scripts
        strip_parent: true
      - src: packaging/scripts/*.ps1
        dst: packaging/scripts
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  name_template: "YunmengZe Agent v{{ .Version }}"
  draft: false
  # Plain vX.Y.Z tags are stable; suffixes such as -rc.1 are prereleases.
  prerelease: auto
  # replace: --release-notes must overwrite an existing tag's body (keep-existing would leave empty).
  mode: replace

# Homebrew/Scoop updates are optional. PACKAGE_GITHUB_TOKEN needs Contents: R/W
# on both package repos; the workflow's GITHUB_TOKEN only publishes this repo.
homebrew_casks:
  - name: ymz
    repository:
      owner: yyZe0122
      name: homebrew-tap
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/yyZe0122/YunmengZe-Agent"
    description: "YunmengZe Agent — local coding agent with a terminal UI"
    license: "Apache-2.0"
    binaries:
      - ymz
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    skip_upload: '{{ if .Env.PACKAGE_GITHUB_TOKEN }}auto{{ else }}true{{ end }}'

scoops:
  - name: ymz
    repository:
      owner: yyZe0122
      name: scoop-bucket
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    homepage: "https://github.com/yyZe0122/YunmengZe-Agent"
    description: "YunmengZe Agent — local coding agent with a terminal UI"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} {{ .Tag }}"
    skip_upload: '{{ if .Env.PACKAGE_GITHUB_TOKEN }}auto{{ else }}true{{ end }}'

# Do NOT set changelog.disable: goreleaser Skip() then never reads --release-notes.
# scripts/publish-release.sh passes the versioned file via --release-notes
# and verifies the published body and assets after upload.
