name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and tests
        shell: pwsh
        run: ./scripts/dev.ps1 -Action check
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts, packaging/scripts -Filter *.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Out-String | Write-Error
              exit 1
            }
          }
      - name: Build ymz
        shell: pwsh
        run: ./scripts/dev.ps1 -Action build

  ubuntu:
    name: Ubuntu AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and tests
        run: make check
      - name: Validate packaging shell scripts
        run: |
          bash -n scripts/publish-release.sh
          sh -n scripts/refresh-modelcatalog.sh
          for script in packaging/scripts/*.sh; do
            sh -n "$script"
          done
      - name: Dependency verification
        run: |
          go mod verify
          go mod tidy -diff
      - name: CGo-free native build
        env:
          CGO_ENABLED: "0"
        run: make build
