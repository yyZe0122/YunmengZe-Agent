name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        run: bash scripts/publish-release.sh "$GITHUB_REF_NAME" --check

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release commit
        run: |
          go mod verify
          go mod tidy -diff
          make check

      - name: Validate shell scripts
        run: |
          bash -n scripts/publish-release.sh
          sh -n scripts/refresh-modelcatalog.sh
          for script in packaging/scripts/*.sh; do
            sh -n "$script"
          done

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts, packaging/scripts -Filter *.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Out-String | Write-Error
              exit 1
            }
          }

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.3"
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Build, publish and verify release
        run: bash scripts/publish-release.sh "$GITHUB_REF_NAME" --ci-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional; absent means GitHub assets only, without tap/bucket updates.
          PACKAGE_GITHUB_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}
