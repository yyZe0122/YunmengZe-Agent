name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release commit
        run: |
          go mod verify
          make check

      - name: Validate packaging shell scripts
        run: |
          for script in packaging/scripts/*.sh scripts/package-vscode.sh; do
            sh -n "$script"
          done

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './packaging/scripts/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Error
            exit 1
          }

      - name: Resolve release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/history/changelog/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes file: $notes" >&2
            echo "Add docs/history/changelog/${tag}.md before tagging." >&2
            exit 1
          fi
          bytes=$(wc -c < "$notes" | tr -d ' ')
          if [ "$bytes" -lt 400 ]; then
            echo "Release notes too short ($bytes bytes): $notes" >&2
            exit 1
          fi
          grep -q "^# YunmengZe Agent ${tag}$" "$notes" \
            || { echo "Title must be '# YunmengZe Agent ${tag}'" >&2; exit 1; }
          grep -q "## Highlights" "$notes" \
            || { echo "Must include ## Highlights (GitHub Release body)" >&2; exit 1; }
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "Using release notes: $notes"

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 2 --release-notes=${{ steps.notes.outputs.path }}
        env:
          # Main repo Release assets only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap + Scoop bucket (Contents R/W on both affiliate repos).
          PACKAGE_GITHUB_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Set GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/history/changelog/${tag}.md"
          gh release edit "$tag" --notes-file "$notes"
          body=$(gh release view "$tag" --json body --jq .body)
          echo "$body" | grep -q "YunmengZe Agent ${tag}" \
            || { echo "Release body does not match ${notes}" >&2; exit 1; }

      - name: Package and upload VS Code VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          vsix="extensions/vscode/ymz-vscode_${ver}.vsix"
          sh ./scripts/package-vscode.sh "$tag"
          if [ ! -f "$vsix" ]; then
            vsix="dist/vscode/ymz-vscode_${ver}.vsix"
          fi
          gh release upload "$tag" "$vsix" --clobber
